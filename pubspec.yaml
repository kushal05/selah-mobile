name: notify
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.1+25

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.0.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6
  path_provider: ^2.1.4
  path: ^1.9.0

  # Swipe Actions
  flutter_slidable: ^3.1.1

  # Network & Sync
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  device_info_plus: ^11.2.0

  # Export
  pdf: ^3.11.0
  share_plus: ^10.0.0
  printing: ^5.13.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Deep Linking
  app_links: ^6.4.0

  # Home-screen widgets (Android App Widgets / iOS WidgetKit bridge)
  home_widget: ^0.7.0

  # App Info & Updates
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1

  # Authentication
  google_sign_in: ^6.2.1

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
