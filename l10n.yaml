# Localisation config. `flutter gen-l10n` (run automatically by `flutter pub get`
# and by builds, because pubspec sets `generate: true`) turns the ARB files in
# lib/l10n into an AppLocalizations class.
#
# To add a language: copy app_en.arb to app_<code>.arb, translate the values,
# and add the locale to supportedLocales in main.dart. No code changes needed.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
